# Netlify proxies API calls to the AWS backend, so the browser stays on HTTPS
# (no mixed-content or CORS problems). Replace BACKEND_HOST with your ingress domain/IP.
[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://django-blog-latest-zfn4.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/posts/*"
  to = "https://django-blog-latest-zfn4.onrender.com/posts/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/posts"
  to = "https://django-blog-latest-zfn4.onrender.com/posts/"
  status = 200
  force = true
