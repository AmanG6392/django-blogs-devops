# Run from repo root:  docker compose -f docker/docker-compose.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: blog
      DB_USER: blog
      DB_PASSWORD: blog
      DJANGO_SECRET_KEY: local-dev-secret
      DEMO_USER: demo
      DEMO_PASSWORD: demo12345
    depends_on:
      db: {condition: service_healthy}

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on: [web]

volumes:
  pgdata:
