name: CD
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted     # the EC2 runner that has kubectl + cluster access
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI to publish the image for this commit
        run: |
          IMG=${{ secrets.DOCKERHUB_USERNAME }}/django-blog:${{ github.sha }}
          for i in $(seq 1 60); do
            docker manifest inspect "$IMG" >/dev/null 2>&1 && exit 0
            echo "image not ready yet ($i/60)"; sleep 15
          done
          echo "image $IMG never appeared"; exit 1

      - name: Deploy to Kubernetes
        run: |
          sed -i "s|DOCKERHUB_USER/django-blog:latest|${{ secrets.DOCKERHUB_USERNAME }}/django-blog:${{ github.sha }}|" k8s/deployment.yaml
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/config.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml -f k8s/ingress.yaml
          kubectl -n blog rollout status deployment/blog-backend --timeout=180s
